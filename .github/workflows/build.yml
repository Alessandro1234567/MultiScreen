name: build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-android:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev \
            wayland-protocols plasma-wayland-protocols aapt apksigner zipalign android-sdk-platform-23 dalvik-exchange
      - name: Chiave di firma Android (segreto opzionale ANDROID_KEYSTORE_B64)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/multiscreen.keystore; fi
      - name: Compila
        run: bash tools/make-release.sh
      - id: v
        run: echo "version=$(grep -oP 'MS_VERSION "\K[^"]+' linux/src/common.h)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-android
          path: dist/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compila
        shell: pwsh
        run: |
          dotnet publish windows/MultiScreen/MultiScreen.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o windows/publish
          $v = Select-String -Path android/AndroidManifest.xml -Pattern 'versionCode="(\d+)"' | % { $_.Matches[0].Groups[1].Value }
          Set-Content -Path windows/publish/apk-version -Value $v -NoNewline
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $env:MS_VERSION = (Select-String -Path linux/src/common.h -Pattern 'MS_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MultiScreen-Setup.exe
  release:
    needs: [linux-android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.linux-android.outputs.version }}
          name: MultiScreen ${{ needs.linux-android.outputs.version }}
          make_latest: true
          files: dist/*
          body: |
            **PC con Linux (KDE Plasma):** apri Konsole e incolla
            ```
            curl -fsSL https://raw.githubusercontent.com/Alessandro1234567/multiscreen/main/get.sh | bash
            ```
            **PC con Windows 10/11:** scarica ed esegui `MultiScreen-Setup.exe` qui sotto.

            **Tablet:** attiva *Debug USB* e collega il cavo: l'app si installa da sola
            (oppure installa `MultiScreen.apk` da qui).
