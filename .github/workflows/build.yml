name: build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-android:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev \
            wayland-protocols plasma-wayland-protocols aapt apksigner zipalign android-sdk-platform-23 dalvik-exchange
      - name: Chiave di firma Android (segreto opzionale ANDROID_KEYSTORE_B64)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/multiscreen.keystore; fi
      - name: Compila
        run: bash tools/make-release.sh
      - id: v
        run: echo "version=$(grep -oP 'MS_VERSION "\K[^"]+' linux/src/common.h)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-android
          path: dist/*
  release:
    needs: [linux-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.linux-android.outputs.version }}
          name: MultiScreen ${{ needs.linux-android.outputs.version }}
          make_latest: true
          files: dist/*
          body: |
            **PC con Linux (KDE Plasma):** apri Konsole e incolla
            ```
            curl -fsSL https://raw.githubusercontent.com/Alessandro1234567/multiscreen/main/get.sh | bash
            ```
            **Tablet:** attiva *Debug USB* e collega il cavo: l'app si installa da sola
            (oppure installa `MultiScreen.apk` da qui).
