name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev \
            wayland-protocols plasma-wayland-protocols aapt apksigner zipalign android-sdk-platform-23 dalvik-exchange
      - name: Chiave di firma Android (opzionale, segreto ANDROID_KEYSTORE_B64)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/multiscreen.keystore; fi
      - name: Compila
        run: bash tools/make-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: multiscreen
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
